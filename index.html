<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro Mapa de Viajes AR</title>

<!-- Consola de depuración en el propio móvil (botón flotante). Borra estas dos líneas cuando todo funcione -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<!-- Combinación oficial de MindAR (el orden importa: core, A-Frame, plugin A-Frame) -->
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin:0; padding:0; height:100%; background:#111; font-family:-apple-system, system-ui, sans-serif; }
  a-scene { position:fixed; inset:0; z-index:5; }

  #home {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center; color:#fff; background:#111; z-index:20;
  }
  #home h1 { font-size:1.4rem; margin:0 0 8px; }
  #home p { color:#aaa; font-size:0.95rem; max-width:340px; }
  .btn { padding:14px 28px; border-radius:12px; border:none; font-size:1rem; font-weight:600; cursor:pointer; width:260px; }
  .btn-primary { background:#e63946; color:#fff; }
  .btn-secondary { background:#2a2a2a; color:#fff; }

  #list-view { display:none; position:fixed; inset:0; background:#111; color:#fff; z-index:21; overflow-y:auto; padding:70px 16px 60px; }
  .trip-card { background:#1c1c1c; border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer; }
  .trip-card h3 { margin:0 0 4px; font-size:1.05rem; }
  .trip-card span { color:#999; font-size:0.85rem; }

  #back-btn {
    display:none; position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:25;
    background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:20px; padding:8px 16px; font-size:0.9rem;
  }

  #modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:flex-end; justify-content:center; z-index:30; }
  #modal-card {
    background:#1a1a1a; color:#fff; width:100%; max-width:520px; max-height:80vh; border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); overflow-y:auto;
  }
  #modal-card h2 { margin:0 0 4px; }
  #modal-card .date { color:#e63946; font-size:0.9rem; margin-bottom:12px; display:block; }
  #modal-card p { line-height:1.5; color:#ddd; }
  #modal-photos { display:flex; gap:8px; overflow-x:auto; margin:12px 0; padding-bottom:4px; }
  #modal-photos img { height:130px; border-radius:10px; flex:0 0 auto; }
  #modal-close { display:block; margin:16px auto 0; background:#e63946; color:#fff; border:none; border-radius:10px; padding:10px 24px; font-size:0.95rem; }
</style>
</head>
<body>

<!-- ESCENA AR: siempre presente (no oculta) y tapada por la pantalla de inicio hasta que se pulsa el botón -->
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
         color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false">
    <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .marker; far: 10000;"></a-entity>
  </a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<div id="home">
  <h1>🗺️ Nuestro Mapa de Viajes</h1>
  <p>Apunta con la cámara al mapa de la pared para ver dónde hemos estado, o consulta la lista sin cámara.</p>
  <button class="btn btn-primary" id="start-ar">Escanear el mapa (AR)</button>
  <button class="btn btn-secondary" id="start-list">Ver lista de viajes</button>
</div>

<button id="back-btn">← Volver</button>
<div id="list-view"></div>

<div id="modal-overlay">
  <div id="modal-card">
    <span class="date" id="modal-date"></span>
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div id="modal-photos"></div>
    <button id="modal-close">Cerrar</button>
  </div>
</div>

<script>
/* =========================================================================
   EDITA AQUÍ TUS VIAJES
   x, y: posición sobre el plano de la imagen del mapa (el centro es 0,0;
         el ancho total de la imagen mide 1 unidad: x va de -0.5 a 0.5)
   photos: lista de URLs de fotos
   ========================================================================= */
const TRIPS = [
  { id:"japon", x:0.32, y:0.10, title:"Japón", date:"Abril 2023",
    description:"Dos semanas recorriendo Tokio, Kioto y Osaka.",
    photos:["https://via.placeholder.com/300x200?text=Foto+1","https://via.placeholder.com/300x200?text=Foto+2"] },
  { id:"peru", x:-0.28, y:-0.05, title:"Perú", date:"Julio 2022",
    description:"Machu Picchu, el Valle Sagrado y Lima.",
    photos:["https://via.placeholder.com/300x200?text=Foto+1"] },
  { id:"marruecos", x:-0.02, y:-0.02, title:"Marruecos", date:"Octubre 2021",
    description:"Marrakech y el desierto de Merzouga.",
    photos:["https://via.placeholder.com/300x200?text=Foto+1"] },
  { id:"italia", x:0.05, y:0.12, title:"Italia", date:"Junio 2024",
    description:"Roma, Florencia y la costa amalfitana.",
    photos:["https://via.placeholder.com/300x200?text=Foto+1"] }
];
const tripsById = Object.fromEntries(TRIPS.map(t => [t.id, t]));

function openModal(id) {
  const t = tripsById[id]; if (!t) return;
  document.getElementById("modal-date").textContent = t.date;
  document.getElementById("modal-title").textContent = t.title;
  document.getElementById("modal-desc").textContent = t.description;
  const ph = document.getElementById("modal-photos"); ph.innerHTML = "";
  (t.photos || []).forEach(src => { const i = document.createElement("img"); i.src = src; ph.appendChild(i); });
  document.getElementById("modal-overlay").style.display = "flex";
}
document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").style.display = "none";
});

// Marcadores sobre el mapa
window.addEventListener("DOMContentLoaded", () => {
  const target = document.getElementById("target");
  TRIPS.forEach(t => {
    const m = document.createElement("a-circle");
    m.setAttribute("position", `${t.x} ${t.y} 0`);
    m.setAttribute("radius", "0.03");
    m.setAttribute("color", "#e63946");
    m.setAttribute("class", "marker");
    m.addEventListener("click", () => openModal(t.id));
    target.appendChild(m);
  });
});

// Botón AR: arranca la cámara tras el toque del usuario
document.getElementById("start-ar").addEventListener("click", async () => {
  const scene = document.querySelector("a-scene");
  try {
    if (!scene.hasLoaded) await new Promise(r => scene.addEventListener("loaded", r, { once:true }));
    document.getElementById("home").style.display = "none";
    document.getElementById("back-btn").style.display = "block";
    await scene.systems["mindar-image-system"].start();
  } catch (e) {
    console.error("Error al iniciar AR:", e);
    alert("No se pudo iniciar la cámara AR: " + (e && e.message ? e.message : e));
    document.getElementById("home").style.display = "flex";
    document.getElementById("back-btn").style.display = "none";
  }
});

// Lista sin cámara
document.getElementById("start-list").addEventListener("click", () => {
  document.getElementById("home").style.display = "none";
  document.getElementById("back-btn").style.display = "block";
  const el = document.getElementById("list-view");
  el.style.display = "block";
  el.innerHTML = TRIPS.map(t => `<div class="trip-card" data-trip="${t.id}"><h3>${t.title}</h3><span>${t.date}</span></div>`).join("");
  el.querySelectorAll(".trip-card").forEach(c => c.addEventListener("click", () => openModal(c.dataset.trip)));
});
document.getElementById("back-btn").addEventListener("click", () => location.reload());
</script>
</body>
</html>
