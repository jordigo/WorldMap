<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro Mapa de Viajes AR</title>

<!--
  ===========================================================================
  CÓMO PONER ESTO EN MARCHA (léelo antes de tocar nada más)
  ===========================================================================
  1) Haz una foto plana y frontal de tu mapa (buena luz, sin reflejos).
  2) Ve a: https://hiukim.github.io/mind-ar-js-doc/tools/compile/
     Sube tu foto y descarga el archivo "targets.mind" que genera.
  3) Coloca ese "targets.mind" en la MISMA carpeta que este archivo .html.
  4) Sube ambos archivos a un hosting gratuito de páginas estáticas:
     GitHub Pages, Netlify o Vercel funcionan perfectamente y son gratis.
     (Esto es necesario: esta página no puede depender de un único archivo
     porque el target de la imagen es un fichero binario aparte).
  5) Abre la URL desde el móvil, dale permiso a la cámara y apunta al mapa.
  6) Edita el array TRIPS más abajo con tus viajes reales: título, fecha,
     descripción y fotos (puedes usar enlaces a fotos alojadas online, por
     ejemplo en Imgur, o convertirlas a base64 si las quieres 100% offline).
  7) Los valores x/y de cada "position" son coordenadas sobre la imagen del
     mapa (el centro es 0,0). Ajusta por prueba y error hasta que el punto
     caiga sobre el país correcto: aumenta X para mover a la derecha,
     aumenta Y para mover hacia arriba.
  ===========================================================================
-->

<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; background:#111; font-family: -apple-system, system-ui, sans-serif; }
  #home {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center; color:#fff; background:#111; z-index:20;
  }
  #home h1 { font-size:1.4rem; margin:0 0 8px; }
  #home p { color:#aaa; font-size:0.95rem; max-width:340px; }
  .btn {
    padding:14px 28px; border-radius:12px; border:none; font-size:1rem; font-weight:600;
    cursor:pointer; width:260px;
  }
  .btn-primary { background:#e63946; color:#fff; }
  .btn-secondary { background:#2a2a2a; color:#fff; }

  #ar-container, #list-view { display:none; }
  a-scene { position:fixed; inset:0; z-index:5; }

  #list-view {
    position:fixed; inset:0; background:#111; color:#fff; z-index:20; overflow-y:auto;
    padding:20px 16px 60px;
  }
  #list-view .trip-card {
    background:#1c1c1c; border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer;
  }
  #list-view .trip-card h3 { margin:0 0 4px; font-size:1.05rem; }
  #list-view .trip-card span { color:#999; font-size:0.85rem; }
  #back-btn {
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:25;
    background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:20px; padding:8px 16px; font-size:0.9rem;
  }

  /* Ficha de viaje (modal) */
  #modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
    align-items:flex-end; justify-content:center; z-index:30;
  }
  #modal-card {
    background:#1a1a1a; color:#fff; width:100%; max-width:520px; max-height:80vh;
    border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
  }
  #modal-card h2 { margin:0 0 4px; }
  #modal-card .date { color:#e63946; font-size:0.9rem; margin-bottom:12px; display:block; }
  #modal-card p { line-height:1.5; color:#ddd; }
  #modal-photos { display:flex; gap:8px; overflow-x:auto; margin:12px 0; padding-bottom:4px; }
  #modal-photos img { height:130px; border-radius:10px; flex:0 0 auto; }
  #modal-close {
    display:block; margin:16px auto 0; background:#e63946; color:#fff; border:none;
    border-radius:10px; padding:10px 24px; font-size:0.95rem;
  }
</style>
</head>
<body>

<!-- PANTALLA DE INICIO -->
<div id="home">
  <h1>🗺️ Nuestro Mapa de Viajes</h1>
  <p>Apunta con la cámara al mapa de la pared para ver dónde hemos estado, o consulta la lista sin cámara.</p>
  <button class="btn btn-primary" id="start-ar">Escanear el mapa (AR)</button>
  <button class="btn btn-secondary" id="start-list">Ver lista de viajes</button>
</div>

<!-- VISTA LISTA (no necesita cámara, útil para probar en el ordenador) -->
<button id="back-btn" style="display:none">← Volver</button>
<div id="list-view"></div>

<!-- ESCENA AR -->
<div id="ar-container">
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
           color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: true">
    <a-assets></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .marker; far: 1000;"></a-entity>
    </a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Los marcadores se generan por JavaScript a partir de TRIPS -->
    </a-entity>
  </a-scene>
</div>

<!-- FICHA DE VIAJE -->
<div id="modal-overlay">
  <div id="modal-card">
    <span class="date" id="modal-date"></span>
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div id="modal-photos"></div>
    <button id="modal-close">Cerrar</button>
  </div>
</div>

<script>
/* =========================================================================
   EDITA AQUÍ TUS VIAJES REALES
   x, y: posición sobre el plano de la imagen del mapa (metros, centro=0,0)
   photos: array de URLs de imágenes (o data URLs en base64)
   ========================================================================= */
const TRIPS = [
  {
    id: "japon",
    x: 0.32, y: 0.10,
    title: "Japón",
    date: "Abril 2023",
    description: "Dos semanas recorriendo Tokio, Kioto y Osaka durante la temporada de los cerezos en flor.",
    photos: [
      "https://via.placeholder.com/300x200?text=Foto+1",
      "https://via.placeholder.com/300x200?text=Foto+2"
    ]
  },
  {
    id: "peru",
    x: -0.28, y: -0.05,
    title: "Perú",
    date: "Julio 2022",
    description: "Machu Picchu, el Valle Sagrado y unos días en Lima probando cocina peruana.",
    photos: ["https://via.placeholder.com/300x200?text=Foto+1"]
  },
  {
    id: "marruecos",
    x: -0.02, y: -0.02,
    title: "Marruecos",
    date: "Octubre 2021",
    description: "Marrakech, el desierto de Merzouga y una noche bajo las estrellas en el Sahara.",
    photos: ["https://via.placeholder.com/300x200?text=Foto+1"]
  },
  {
    id: "italia",
    x: 0.05, y: 0.12,
    title: "Italia",
    date: "Junio 2024",
    description: "Roma, Florencia y la costa amalfitana.",
    photos: ["https://via.placeholder.com/300x200?text=Foto+1"]
  }
];

const tripsById = Object.fromEntries(TRIPS.map(t => [t.id, t]));

function openModal(id) {
  const t = tripsById[id];
  if (!t) return;
  document.getElementById("modal-date").textContent = t.date;
  document.getElementById("modal-title").textContent = t.title;
  document.getElementById("modal-desc").textContent = t.description;
  const photosEl = document.getElementById("modal-photos");
  photosEl.innerHTML = "";
  (t.photos || []).forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    photosEl.appendChild(img);
  });
  document.getElementById("modal-overlay").style.display = "flex";
}
document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").style.display = "none";
});

// --- Pantalla de inicio -> AR ---
document.getElementById("start-ar").addEventListener("click", () => {
  document.getElementById("home").style.display = "none";
  document.getElementById("ar-container").style.display = "block";

  const targetEntity = document.getElementById("target");
  TRIPS.forEach(t => {
    const marker = document.createElement("a-circle");
    marker.setAttribute("position", `${t.x} ${t.y} 0`);
    marker.setAttribute("radius", "0.03");
    marker.setAttribute("color", "#e63946");
    marker.setAttribute("class", "marker");
    marker.setAttribute("data-trip", t.id);
    marker.addEventListener("click", () => openModal(t.id));
    targetEntity.appendChild(marker);
  });
});

// --- Pantalla de inicio -> Lista (sin cámara, para probar rápido) ---
document.getElementById("start-list").addEventListener("click", () => {
  document.getElementById("home").style.display = "none";
  document.getElementById("back-btn").style.display = "block";
  const listEl = document.getElementById("list-view");
  listEl.style.display = "block";
  listEl.innerHTML = TRIPS.map(t => `
    <div class="trip-card" data-trip="${t.id}">
      <h3>${t.title}</h3>
      <span>${t.date}</span>
    </div>
  `).join("");
  listEl.querySelectorAll(".trip-card").forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.trip));
  });
});
document.getElementById("back-btn").addEventListener("click", () => location.reload());
</script>
</body>
</html>
