  #home h1 { font-size:1.4rem; margin:0 0 8px; text-shadow:0 1px 8px #000; }
  #home p { color:#ddd; font-size:0.95rem; max-width:340px; text-shadow:0 1px 8px #000; }

  .btn-primary { background:#e63946; color:#fff; }

  #legend i, .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }

  #list-view h3 { margin:18px 0 8px; font-size:0.95rem; color:#bbb; font-weight:600; }
  .row { background:#1c1c1c; border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; }
  .row b { font-weight:600; }
  .row small { color:#999; margin-left:auto; padding-left:10px; }

  /* Capas: ficha (1) -> galería (2) -> visor (3) */

                border-radius:20px 20px 0 0; box-sizing:border-box; overflow:hidden; }
  #card-head { flex:none; padding:16px 18px 6px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #card-inner.expanded #card-head { padding-top:calc(16px + env(safe-area-inset-top,0px)); }
  #card-inner.has-photos #card-head { cursor:pointer; }
  #card-grab { display:block; width:42px; height:4px; border-radius:2px; background:#666; margin:0 auto 12px; }
  .head-row { display:flex; align-items:center; justify-content:space-between; }
  #card-count { color:#bbb; font-size:0.85rem; }
  #card-body { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:0 18px calc(20px + env(safe-area-inset-bottom,0px)); }
  #card-inner:not(.expanded) #card-photos .grid .ph:nth-child(n+10) { display:none; }   /* plegada: máximo 3 filas (9 fotos) */
  #card-inner.expanded .more { display:none; }
  .chip { display:inline-block; font-size:0.75rem; font-weight:600; padding:3px 10px; border-radius:20px; color:#fff; margin-bottom:8px; }

  #pick-inner h4 { margin:0 0 10px; font-size:0.95rem; color:#bbb; font-weight:600; }

<script>
/* ===========================================================================
   CONFIGURACIÓN
   =========================================================================== */
// Tamaño (en píxeles) de la foto con la que generaste targets.mind (solo importan sus proporciones: 4:3)
const IMG_W = 2576, IMG_H = 1932;
// Ancho REAL (en metros) de lo que abarca esa foto en la pared. El mapa mide 1,5 x 1 m y en la
// foto nueva ocupa casi todo el ancho (unos 1,53-1,59 m según se mida por ancho o por alto).
// De él depende el cálculo de "a cuántos metros estoy" para el tamaño de los puntos.
const TARGET_WIDTH_M = 1.55;
// Tamaño de los puntos en pantalla (píxeles CSS): lejos (>= 2 m) y cerca (<= 0.5 m)
const DOT_PX_FAR = 9, DOT_PX_NEAR = 22, DIST_FAR_M = 2.0, DIST_NEAR_M = 0.5;
// Un punto nunca es más grande que esta fracción de la distancia (en pantalla) a su vecino
// más cercano, ni más pequeño que DOT_PX_MIN. Así los puntos muy juntos se encogen solos.
const NEIGHBOR_FACTOR = 0.7, DOT_PX_MIN = 5;
// Suavizado propio de la posición del mapa (contra la vibración). ALPHA_MIN más bajo = más
// estable pero con más retardo al mover. Si el error entre la posición medida y la suavizada
// es menor que DEAD_PX se suaviza al máximo; a partir de FULL_PX se sigue el movimiento sin retardo.
const SMOOTH_ALPHA_MIN = 0.12, SMOOTH_DEAD_PX = 2, SMOOTH_FULL_PX = 22;
const DEBUG = location.search.includes("debug");
// Al tocar se consideran los puntos a menos de TAP_RADIUS_PX del dedo. Si el más cercano
// no gana por al menos AMBIG_PX al segundo, se muestra un selector con las opciones.
const TAP_RADIUS_PX = 38, AMBIG_PX = 12;
// Ajuste fino global de posición de los puntos (si todos salen algo desplazados)
const CAL = { sx: 1, sy: 1, ox: 0, oy: 0 };
// false = solo el año; true = fecha completa si el viaje tiene "date" (AAAA-MM-DD o AAAA-MM)
const SHOW_FULL_DATE = false;
// Opacidad de la foto de fondo de la pantalla de inicio (0.5 = 50 %, se ve atenuada sobre negro)
const HOME_BG_OPACITY = 0.5;

const WHO = {
  J: { color: "#2f80ff", label: "Jordi" },
  M: { color: "#ff3ea5", label: "Mireia" },
  A: { color: "#2fc45a", label: "Mireia y Jordi" },
  W: { color: "#ff8a00", label: "Nos gustaría ir" }
};

/* ===========================================================================
   TUS VIAJES
   who: "J" Jordi (azul) · "M" Mireia (rosa) · "A" ambos (verde) · "W" lista de deseos (naranja)
   lugar: ciudad/sitio (null si solo se conoce el país -> el punto va en la capital)
   px: posición [x, y] sobre la foto del mapa (2576x1932)
   year: lo que se muestra · date: "AAAA-MM[-DD]" opcional · notes: texto libre
   photos: lista de rutas/URLs, p. ej. ["fotos/sydney1.jpg", "fotos/sydney2.jpg"]
   Si un mismo sitio lo visitasteis por separado (J y M), salen dos puntos juntos y
   el año lleva "(J)" / "(M)" automáticamente.
   =========================================================================== */
// fotos("sydney", 12) -> ["fotos/sydney/01.jpg", ..., "fotos/sydney/12.jpg"]
const fotos = (carpeta, n) => Array.from({ length: n }, (_, i) => "fotos/" + carpeta + "/" + String(i + 1).padStart(2, "0") + ".jpg");
const E = (who, lugar, pais, px, o = {}) => Object.assign({ who, lugar, pais, px, photos: [], notes: "" }, o);
const TRIPS = [
  // ---- Jordi (azul) ----
  E("A", "San Francisco", "Estados Unidos", [256, 795], { year: 2008, date: "2008-07" }),
  E("J", "Las Vegas",     "Estados Unidos", [304, 807], { year: 2008, date: "2008-07" }),
  E("J", "Yosemite",      "Estados Unidos", [283, 795], { year: 2008, date: "2008-07" }),
  E("A", "Nueva York",    "Estados Unidos", [622, 776], { year: 2008, date: "2008-07" }),
  E("A", "Roma",          "Italia", [1264, 778]),
  E("J", "Venecia",       "Italia", [1261, 747]),
  E("J", "Florencia",     "Italia", [1251, 758]),
  E("J", "Copenhague",    "Dinamarca", [1233, 645]),
  E("J", "Ámsterdam",     "Países Bajos", [1206, 678]),
  E("A", "Londres",       "Reino Unido", [1135, 693], { year: 2012, date: "2012-09" }),
  E("J", "Glasgow",       "Reino Unido", [1118, 654], { year: 2012, date: "2012-09" }),
  E("A", "Edimburgo",     "Reino Unido", [1130, 651], { year: 2012, date: "2012-09" }),
  E("J", "Inverness",     "Reino Unido", [1122, 639], { year: 2012, date: "2012-09" }),

  // ---- Mireia (rosa) ----
  E("M", "Santiago",         "Chile", [623, 1412], { year: "1999–2004" }),
  E("M", "Atacama",          "Chile", [623, 1325],  { year: "1999–2004" }),
  E("M", "Torres del Paine", "Chile", [628, 1562], { year: "1999–2004" }),
  E("M", "Isla de Pascua",   "Chile", [510, 1379],  { year: "1999–2004" }),
  E("M", null, "Argentina",           [717, 1408]), // Buenos Aires
  E("M", null, "Perú",                [571, 1228]),  // Lima
  E("M", null, "Uruguay",             [742, 1413]), // Montevideo
  E("M", null, "Brasil",              [786, 1256]),  // Brasilia
  E("M", null, "Paraguay",            [703, 1331]),  // Asunción
  E("M", "Yucatán", "México", [485, 972]),   // Mérida / Cancún
  E("M", null, "República Dominicana",[686, 986]),  // Santo Domingo
  E("M", "Toronto",  "Canadá", [573, 745]),
  E("M", "Ottawa",   "Canadá", [601, 729]),
  E("M", "Montreal", "Canadá", [617, 728]),
  E("M", "Quebec",   "Canadá", [636, 714]),
  E("M", "Banff",    "Canadá", [328, 664]),
  E("M", null, "Grecia",              [1337, 810]), // Atenas

  // ---- Ambos (naranja) ----
  E("A", "Lisboa", "Portugal", [1112, 809], { year: 2015, date: "2015-08" }),
  E("A", null, "Islandia",     [995, 552],  { year: 2015, date: "2015-09" }), // Reikiavik
  E("A", "Cairns",       "Australia",     [2306, 1314],  { year: 2019, date: "2019-08", photos: fotos("cairns", 6) }),
  E("A", "Sídney",       "Australia",     [2357, 1425], { year: 2019, date: "2019-08", photos: fotos("sidney", 15) }),
  E("A", "Melbourne",    "Australia",     [2292, 1507], { year: 2019, date: "2019-08", photos: fotos("melbourne", 10) }),
  E("A", "Perth",        "Australia",     [2066, 1437], { year: 2019, date: "2019-08", photos: fotos("perth", 7) }),
  E("A", "Auckland",     "Nueva Zelanda", [2523, 1514], { year: 2019, date: "2019-08", photos: fotos("auckland", 37) }),
  E("A", "Christchurch", "Nueva Zelanda", [2466, 1573], { year: 2019, date: "2019-08", photos: fotos("christchurch", 62) }),
  E("A", null, "Singapur",     [1979, 1110], { year: 2019, date: "2019-08", photos: fotos("singapur", 11) }),
  E("A", null, "Cuba",         [551, 956],  { year: 2016, date: "2016-08" }),  // La Habana

  // ---- Añadidos desde las chinchetas del mapa antiguo ----
  E("J", "Los Ángeles",   "Estados Unidos", [277, 838]),
  E("J", "Helsinki",      "Finlandia",      [1326, 572]),
  E("M", "Vancouver",     "Canadá",         [272, 686]),
  E("M", "Florida",       "Estados Unidos", [542, 905]),   // Orlando / Miami
  E("M", "Boston",        "Estados Unidos", [666, 755]),
  E("M", "Canarias",      "España",         [1015, 902]),
  E("M", "San Petersburgo", "Rusia",        [1362, 580]),
  E("M", "Berlín",        "Alemania",       [1255, 680]),
  E("M", "Praga",         "Chequia",        [1266, 706]),
  E("M", "Budapest",      "Hungría",        [1305, 722]),
  E("A", "París",         "Francia",        [1183, 722]),
  E("A", "Barcelona",     "España",         [1188, 783]),
  E("A", "Marsella",      "Francia",        [1214, 768]),
  E("A", "Fráncfort",     "Alemania",       [1219, 703]),
  E("A", "Praga",         "Chequia",        [1266, 706]),

  // ---- Nos gustaría ir (naranja) · sacados de las chinchetas naranjas del mapa antiguo ----
  E("W", "Hawái",           "Estados Unidos", [100, 912]),
  E("W", "Manaos",          "Brasil",         [691, 1177]),
  E("W", "Río de Janeiro",  "Brasil",         [848, 1280]),   // ¿o São Paulo? por confirmar
  E("W", "Porto Alegre",    "Brasil",         [775, 1370]),
  E("W", "Oslo",            "Noruega",        [1228, 589]),
  E("W", "Estocolmo",       "Suecia",         [1258, 595]),
  E("W", "Cracovia",        "Polonia",        [1313, 700]),
  E("W", "Vilna",           "Lituania",       [1332, 642]),
  E("W", "El Cairo",        "Egipto",         [1417, 890]),
  E("W", "Ciudad del Cabo", "Sudáfrica",      [1306, 1388]),
  E("W", null, "Madagascar",                  [1522, 1262]),  // Antananarivo
  E("W", null, "Seychelles",                  [1590, 1138]),
  E("W", null, "Maldivas",                    [1755, 1116]),  // por confirmar
  E("W", "Bangkok",         "Tailandia",      [1950, 1012]),
  E("W", "Yakarta",         "Indonesia",      [2037, 1204]),
  E("W", "Osaka / Kioto",   "Japón",          [2232, 705]),
  E("W", "Hong Kong",       "China",          [2036, 936])
];

/* ---------- Preparación de datos ---------- */
const ORD = { J: 0, M: 1, A: 2, W: 3 };
const groups = {};
TRIPS.forEach(t => { t.gk = t.pais + "|" + (t.lugar || ""); (groups[t.gk] ||= []).push(t); });
Object.values(groups).forEach(g => {                 // mismo sitio visitado por separado -> puntos juntos y etiqueta
  g.sort((a, b) => ORD[a.who] - ORD[b.who]);
  const multi = new Set(g.filter(t => t.who !== "W").map(t => t.who)).size > 1;
  g.forEach((t, i) => { t.showTag = multi && t.who !== "W"; t.pair = g.length > 1 ? 2 * (i - (g.length - 1) / 2) : 0; });
});
TRIPS.forEach((t, i) => {
  t.id = i;
  t.color = WHO[t.who].color;
  t.x = ((t.px[0] / IMG_W - 0.5) * CAL.sx) + CAL.ox;
  t.y = (((IMG_H / 2 - t.px[1]) / IMG_W) * CAL.sy) + CAL.oy;
});

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function whenText(t) {
  if (t.who === "W") return "Pendiente de visitar";
  let s;
  if (SHOW_FULL_DATE && t.date) {
    const [y, m, d] = t.date.split("-");
    s = [d ? (+d) + " de" : null, m ? MESES[+m - 1] + " de" : null, y].filter(Boolean).join(" ");
  } else s = t.year != null ? String(t.year) : "Año sin indicar";
  return t.showTag ? s + " (" + (t.who === "A" ? "J+M" : t.who) + ")" : s;
}

/* ---------- Componente A-Frame: puntos con tamaño según distancia ---------- */
AFRAME.registerComponent("travel-dots", {
  init() {
    this.v = new THREE.Vector3();
    this.anchor = new THREE.Group();                 // ancla suavizada (no depende directamente de MindAR)
    this.anchor.visible = false;
    this.el.sceneEl.object3D.add(this.anchor);
    this.rp = new THREE.Vector3(); this.rq = new THREE.Quaternion(); this.rs = new THREE.Vector3(1, 1, 1);
    this.sp = new THREE.Vector3(); this.sq = new THREE.Quaternion(); this.ss = new THREE.Vector3(1, 1, 1);
    this.rawM = new THREE.Matrix4(); this.smM = new THREE.Matrix4();
    this.ref = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(-0.4, 0.25, 0), new THREE.Vector3(0.4, -0.25, 0)];
    this.q1 = new THREE.Vector3(); this.q2 = new THREE.Vector3();
    this.has = false; this.frames = 0; this.t0 = performance.now(); this.err = 0;
    this.dots = TRIPS.map(t => {
      const g = new THREE.Group();
      const mk = (r, color, order) => {
        const m = new THREE.Mesh(new THREE.CircleGeometry(r, 24),
          new THREE.MeshBasicMaterial({ color, depthTest: false, depthWrite: false }));
        m.renderOrder = order; return m;
      };
      g.add(mk(1.35, 0xffffff, 10));
      g.add(mk(1, new THREE.Color(t.color), 11));
      this.anchor.add(g);
      return { t, g, dw: 1, sx: 0, sy: 0 };
    });
  },
  tick() {
    const o = this.el.object3D, sc = this.el.sceneEl, cam = sc.camera;
    if (!cam || !sc.canvas) return;
    if (!o.visible) { this.anchor.visible = false; this.has = false; return; }
    const W = sc.canvas.clientWidth, H = sc.canvas.clientHeight;
    /* Suavizado de la pose del mapa */
    o.matrix.decompose(this.rp, this.rq, this.rs);                     // pose medida por MindAR
    if (!this.has) { this.sp.copy(this.rp); this.sq.copy(this.rq); this.ss.copy(this.rs); this.has = true; }
    else {
      this.rawM.compose(this.rp, this.rq, this.rs); this.smM.compose(this.sp, this.sq, this.ss);
      let err = 0;
      for (const r of this.ref) {
        this.q1.copy(r).applyMatrix4(this.rawM).project(cam);
        this.q2.copy(r).applyMatrix4(this.smM).project(cam);
        err = Math.max(err, Math.hypot((this.q1.x - this.q2.x) * W / 2, (this.q1.y - this.q2.y) * H / 2));
      }
      this.err = err;
      const u = Math.min(1, Math.max(0, (err - SMOOTH_DEAD_PX) / (SMOOTH_FULL_PX - SMOOTH_DEAD_PX)));
      const al = SMOOTH_ALPHA_MIN + (1 - SMOOTH_ALPHA_MIN) * u * u;
      this.sp.lerp(this.rp, al); this.sq.slerp(this.rq, al); this.ss.lerp(this.rs, al);
    }
    this.anchor.position.copy(this.sp); this.anchor.quaternion.copy(this.sq); this.anchor.scale.copy(this.ss);
    this.anchor.visible = true; this.anchor.updateMatrixWorld(true);
    if (DEBUG && ++this.frames >= 30) {                                // fps y error en pantalla
      const now = performance.now();
      const el = document.getElementById("dbg");
      if (el) el.textContent = Math.round(this.frames * 1000 / (now - this.t0)) + " fps · err " + this.err.toFixed(1) + " px";
      this.frames = 0; this.t0 = now;
    }
    const f = cam.projectionMatrix.elements[5] * H / 2;                // focal en px
    const k = this.anchor.matrixWorld.getMaxScaleOnAxis() || 1;
    const lf = Math.log(DIST_FAR_M), ln = Math.log(DIST_NEAR_M);
    const D = this.dots, p = this.p || (this.p = new THREE.Vector3());
    for (const d of D) {                                               // 1) distancia y posición en pantalla
      this.v.set(d.t.x, d.t.y, 0).applyMatrix4(this.anchor.matrixWorld);
      d.dw = this.v.length();
      p.copy(this.v).project(cam);
      d.sx = (p.x * 0.5 + 0.5) * W; d.sy = (-p.y * 0.5 + 0.5) * H;
    }
    for (const d of D) {                                               // 2) tamaño de cada punto
      const dm = d.dw * TARGET_WIDTH_M / k;                            // distancia en metros
      const a = Math.min(1, Math.max(0, (lf - Math.log(Math.max(dm, 0.01))) / (lf - ln)));
      let dpx = DOT_PX_FAR + (DOT_PX_NEAR - DOT_PX_FAR) * a;           // diámetro según distancia
      let nn = Infinity;                                               // vecino más cercano (en pantalla)
      for (const e of D) {
        if (e === d || e.t.gk === d.t.gk) continue;
        const q = Math.hypot(e.sx - d.sx, e.sy - d.sy);
        if (q < nn) nn = q;
      }
      dpx = Math.max(DOT_PX_MIN, Math.min(dpx, nn * NEIGHBOR_FACTOR));
      const r = (dpx / 2) * d.dw / f / k;                              // radio local
      d.g.scale.set(r, r, 1);
      d.g.position.set(d.t.x + d.t.pair * 1.4 * r, d.t.y, 0.0005);
    }
  },
  pick(cx, cy) {                                                       // puntos cerca del dedo, ordenados
    const sc = this.el.sceneEl, cam = sc.camera, out = [];
    if (!this.anchor.visible || !cam) return out;
    const rect = sc.canvas.getBoundingClientRect();
    for (const { t, g } of this.dots) {
      this.v.setFromMatrixPosition(g.matrixWorld).project(cam);
      if (this.v.z < -1 || this.v.z > 1) continue;
      const sx = rect.left + (this.v.x * 0.5 + 0.5) * rect.width;
      const sy = rect.top + (-this.v.y * 0.5 + 0.5) * rect.height;
      const d = Math.hypot(sx - cx, sy - cy);
      if (d < TAP_RADIUS_PX) out.push({ t, d });
    }
    return out.sort((a, b) => a.d - b.d);
  }
});

if (DEBUG) {
  window.addEventListener("DOMContentLoaded", () => { document.getElementById("dbg").style.display = "block"; });   // abre la web con ?debug para ver la consola en el móvil
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/eruda";
  s.onload = () => eruda.init();
  document.head.appendChild(s);
}
</script>
</head>
<body>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
         color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0" travel-dots></a-entity>
</a-scene>

<div id="home">
  <div id="home-bg"></div>
  <h1>🗺️ Nuestro Mapa de Viajes</h1>
  <p>Apunta con la cámara al mapa de la pared (en vertical) para ver dónde hemos estado, o consulta la lista sin cámara.</p>
  <button class="btn btn-primary" id="start-ar">Escanear el mapa (AR)</button>
  <button class="btn btn-secondary" id="start-list">Ver lista de viajes</button>
</div>

<button id="back-btn">← Inicio</button>
<div id="legend">
  <div><i style="background:#2f80ff"></i>Jordi</div>
  <div><i style="background:#ff3ea5"></i>Mireia</div>
  <div><i style="background:#2fc45a"></i>Ambos</div>
  <div><i style="background:#ff8a00"></i>Nos gustaría ir</div>
</div>
<div id="list-view"></div>

<div id="pick"><div id="pick-inner">
  <h4>Hay varios puntos cerca. ¿Cuál?</h4>
  <div id="pick-list"></div>
  <button id="pick-close">Cancelar</button>
</div></div>

<div id="card"><div id="card-inner">
  <div id="card-head">
    <div id="card-grab"></div>
    <div class="head-row"><span class="chip" id="card-chip"></span><span id="card-count"></span></div>
    <h2 id="card-title"></h2>
    <div id="card-sub"></div>
    <div id="card-when"></div>
  </div>
  <div id="card-body">
    <p id="card-notes"></p>
    <div id="card-photos"></div>
    <button id="card-close">Cerrar</button>
  </div>
</div></div>

<div id="gallery">
  <header><button id="gallery-back">←</button><span id="gallery-title"></span></header>
  <div class="grid" id="gallery-grid"></div>
</div>
<div id="viewer"><img id="viewer-img" alt=""><div id="viewer-count"></div></div>

<div id="dbg" style="position:fixed;left:8px;bottom:8px;z-index:26;color:#0f0;font:12px monospace;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;display:none"></div>
<div id="rotate">📱 Gira el móvil a vertical para usar la cámara</div>

<script>
const $ = id => document.getElementById(id);
let stack = [], arRunning = false, current = null;

/* ---- Navegación por capas con el botón Atrás de Android ---- */
history.replaceState({ s: [] }, "");
function render() {
  ["pick", "card", "gallery", "viewer"].forEach(n => { $(n).style.display = stack.includes(n) ? "flex" : "none"; });
}
function push(n) { stack = [...stack, n]; history.pushState({ s: stack }, ""); render(); }
window.addEventListener("popstate", e => { stack = (e.state && e.state.s) || []; render(); });
$("card-close").onclick = () => history.back();
$("gallery-back").onclick = () => history.back();
let lastSwipe = 0;
$("viewer").onclick = () => { if (Date.now() - lastSwipe > 400) history.back(); };
$("pick-close").onclick = () => history.back();
$("pick").onclick = e => { if (e.target === $("pick")) history.back(); };

/* ---- Selector cuando hay varios puntos juntos ---- */
function openChooser(list) {
  const box = $("pick-list"); box.innerHTML = "";
  list.forEach(t => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = '<span class="dot" style="background:' + t.color + '"></span><b>' + (t.lugar || t.pais) +
      '</b><small>' + (t.lugar ? t.pais + " · " : "") + whenText(t) + "</small>";
    r.onclick = () => openCard(t);
    box.appendChild(r);
  });
  push("pick");
}

/* ---- Ficha ---- */
function openCard(t) {
  current = t;
  const w = WHO[t.who];
  const chip = $("card-chip"); chip.textContent = w.label; chip.style.background = w.color;
  $("card-title").textContent = t.lugar || t.pais;
  $("card-sub").textContent = t.lugar ? t.pais : "";
  $("card-when").textContent = whenText(t);
  $("card-count").textContent = t.photos.length ? "📷 " + t.photos.length : "";
  $("card-notes").textContent = t.notes || "";
  $("card-notes").style.display = t.notes ? "block" : "none";
  // estado inicial: ficha plegada
  const ci = $("card-inner");
  ci.className = t.photos.length ? "has-photos" : "";
  ci.style.transition = ""; ci.style.height = ""; ci.style.maxHeight = ""; ci.style.transform = "";
  $("card").style.transition = ""; $("card").style.background = ""; $("card-body").scrollTop = 0;
  const box = $("card-photos"); box.innerHTML = "";
  if (!t.photos.length) {
    box.innerHTML = '<div class="nophotos">Aún no hay fotos de este viaje</div>';
  } else {
    const MAX = 9, grid = document.createElement("div"); grid.className = "grid";   // plegada: 3 filas de 3
    t.photos.forEach((src, i) => {
      const d = document.createElement("div"); d.className = "ph";
      d.innerHTML = '<img loading="lazy" src="' + src + '" alt="">';
      const isMore = i === MAX - 1 && t.photos.length > MAX;
      if (isMore) d.insertAdjacentHTML("beforeend", '<div class="more">+' + (t.photos.length - MAX + 1) + "</div>");
      // plegada: la miniatura "+N" abre la galería; ampliada (o resto): se abre la foto pulsada
      d.onclick = () => (isMore && !ci.classList.contains("expanded")) ? openGallery(t) : openGallery(t, i);
      grid.appendChild(d);
    });
    box.appendChild(grid);
  }
  push("card");
  requestAnimationFrame(() => { collapsedH = ci.offsetHeight; });
}

/* ---- Gestos de la ficha ----
   · Arrastrar hacia abajo (plegada)  -> cerrar
   · Arrastrar hacia arriba           -> ocupar toda la pantalla (solo si hay más de 9 fotos)
   · Arrastrar hacia abajo (ampliada) -> volver a plegar
   · Tocar la cabecera                -> abrir la galería
   Se puede arrastrar desde la cabecera o, si el contenido está arriba del todo, desde las fotos. */
let collapsedH = 0, g = null;
const ci = $("card-inner"), cov = $("card"), chead = $("card-head"), cbody = $("card-body");
const canExpand = () => current && current.photos.length > 9;
const lowH = () => collapsedH || Math.round(innerHeight * 0.5);

function setSheet(expand) {                                  // animar a ampliada / plegada
  ci.style.transition = "height .22s ease, transform .2s ease"; ci.style.transform = "";
  cov.style.transition = "background .2s"; cov.style.background = "";
  if (expand) {
    ci.classList.add("expanded"); ci.style.maxHeight = "none"; ci.style.height = innerHeight + "px";
  } else {
    ci.style.height = lowH() + "px";
    setTimeout(() => {
      ci.classList.remove("expanded"); ci.style.transition = ""; ci.style.height = ""; ci.style.maxHeight = "";
      cbody.scrollTop = 0;
    }, 230);
  }
}
function closeSheet() {                                      // deslizar hacia abajo y cerrar
  ci.style.transition = "transform .2s ease-in"; ci.style.transform = "translateY(100%)";
  cov.style.transition = "background .2s"; cov.style.background = "rgba(0,0,0,0)";
  setTimeout(() => history.back(), 200);
}
function gStart(y) { g = { y0: y, h0: ci.offsetHeight, wasExp: ci.classList.contains("expanded"), moved: false, dy: 0 }; }
function gMove(y) {
  if (!g) return;
  const dy = y - g.y0; g.dy = dy;
  if (Math.abs(dy) > 8) g.moved = true;
  if (!g.moved) return;
  ci.style.transition = "none"; cov.style.transition = "none";
  if (g.wasExp) {                                            // ampliada: bajar = plegar, acompañando al dedo
    ci.style.height = Math.min(innerHeight, Math.max(lowH(), g.h0 - dy)) + "px";
  } else if (dy < 0 && canExpand()) {                        // plegada: subir = ampliar (más de 9 fotos)
    ci.classList.add("expanded"); ci.style.maxHeight = "none"; ci.style.transform = "";
    ci.style.height = Math.min(innerHeight, g.h0 - dy) + "px"; cov.style.background = "";
  } else if (dy > 0) {                                       // plegada: bajar = cerrar, la ficha sigue al dedo
    if (ci.classList.contains("expanded")) { ci.classList.remove("expanded"); ci.style.maxHeight = ""; ci.style.height = g.h0 + "px"; }
    ci.style.transform = "translateY(" + dy + "px)";
    cov.style.background = "rgba(0,0,0," + (0.7 * Math.max(0, 1 - dy / g.h0)).toFixed(2) + ")";
  }
}
function gEnd() {                                            // devuelve "tap" si no hubo arrastre
  if (!g) return; const d = g; g = null;
  if (!d.moved) return "tap";
  const dy = d.dy;
  if (d.wasExp) setSheet(!(dy > 40));
  else if (dy > Math.min(110, d.h0 * 0.25)) closeSheet();
  else if (dy < -40 && canExpand()) setSheet(true);
  else setSheet(false);
}
// Cabecera (ratón o dedo)
chead.addEventListener("pointerdown", e => { gStart(e.clientY); chead.setPointerCapture(e.pointerId); });
chead.addEventListener("pointermove", e => gMove(e.clientY));
chead.addEventListener("pointerup", () => { if (gEnd() === "tap" && current && current.photos.length) openGallery(current); });
chead.addEventListener("pointercancel", () => { if (g) { const w = g.wasExp; g = null; setSheet(w); } });
// Cuerpo (fotos): solo arrastra la ficha si el contenido está arriba del todo
let bs = null;
cbody.addEventListener("touchstart", e => {
  bs = e.touches.length === 1 ? { y0: e.touches[0].clientY, top: cbody.scrollTop <= 0, fits: cbody.scrollHeight <= cbody.clientHeight + 2, on: false } : null;
}, { passive: true });
cbody.addEventListener("touchmove", e => {
  if (!bs) return;
  const y = e.touches[0].clientY, dy = y - bs.y0;
  if (!bs.on) {
    const expanded = ci.classList.contains("expanded");
    if ((dy > 6 && bs.top) || (dy < -6 && bs.fits && !expanded && canExpand())) { bs.on = true; gStart(bs.y0); } else return;
  }
  if (e.cancelable) e.preventDefault();
  gMove(y);
}, { passive: false });
cbody.addEventListener("touchend", () => { if (bs && bs.on) gEnd(); bs = null; });
cbody.addEventListener("touchcancel", () => { if (bs && bs.on && g) { const w = g.wasExp; g = null; setSheet(w); } bs = null; });

function openGallery(t, idx) {
  $("gallery-title").textContent = (t.lugar ? t.lugar + ", " : "") + t.pais + " · " + whenText(t);
  const g = $("gallery-grid"); g.innerHTML = "";
  t.photos.forEach((src, i) => {
    const d = document.createElement("div"); d.className = "ph";
    d.innerHTML = '<img loading="lazy" src="' + src + '" alt="">';
    d.onclick = () => openViewer(t.photos, i);
    g.appendChild(d);
  });
  push("gallery");                                  // la galería queda "debajo" para volver con Atrás
  if (idx != null) openViewer(t.photos, idx);       // y la foto pulsada se abre directamente encima
}

/* ---- Visor de fotos: deslizar a izquierda/derecha para cambiar ---- */
let vList = [], vIdx = 0;
const vimg = $("viewer-img");
function setPhoto(i) {
  vIdx = i; vimg.src = vList[i];
  $("viewer-count").textContent = (i + 1) + " / " + vList.length;
  [i - 1, i + 1].forEach(j => { if (vList[j]) { const im = new Image(); im.src = vList[j]; } });   // precarga vecinas
}
function openViewer(list, i) {
  vList = list; setPhoto(i);
  vimg.style.transition = "none"; vimg.style.transform = "translateX(0)"; vimg.style.opacity = 1;
  push("viewer");
}
function goPhoto(dir) {                              // dir = +1 siguiente, -1 anterior
  const n = vIdx + dir;
  if (n < 0 || n >= vList.length) { vimg.style.transition = "transform .15s"; vimg.style.transform = "translateX(0)"; return; }
  vimg.style.transition = "transform .15s ease-out, opacity .15s"; vimg.style.transform = "translateX(" + (-dir * innerWidth * 0.6) + "px)"; vimg.style.opacity = 0;
  setTimeout(() => {
    setPhoto(n);
    vimg.style.transition = "none"; vimg.style.transform = "translateX(" + (dir * innerWidth * 0.4) + "px)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      vimg.style.transition = "transform .18s ease-out, opacity .18s"; vimg.style.transform = "translateX(0)"; vimg.style.opacity = 1;
    }));
  }, 150);
}
let sx = 0, dx = 0, drag = false, moved = false;
$("viewer").addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { drag = false; return; }
  sx = e.touches[0].clientX; dx = 0; drag = true; moved = false; vimg.style.transition = "none";
}, { passive: true });
$("viewer").addEventListener("touchmove", e => {
  if (!drag) return;
  dx = e.touches[0].clientX - sx;
  if (Math.abs(dx) > 10) moved = true;
  if (moved) vimg.style.transform = "translateX(" + dx + "px)";
}, { passive: true });
$("viewer").addEventListener("touchend", () => {
  if (!drag) return; drag = false;
  if (moved) lastSwipe = Date.now();
  if (moved && Math.abs(dx) > 60) goPhoto(dx < 0 ? 1 : -1);
  else if (moved) { vimg.style.transition = "transform .15s"; vimg.style.transform = "translateX(0)"; }
});
document.addEventListener("keydown", e => {
  if (!stack.includes("viewer")) return;
  if (e.key === "ArrowRight") goPhoto(1); else if (e.key === "ArrowLeft") goPhoto(-1);
});

/* ---- Fondo aleatorio de la pantalla de inicio (una foto de la galería) ---- */
(function setHomeBackground() {
  const bg = $("home-bg"); bg.style.opacity = HOME_BG_OPACITY;
  const pool = TRIPS.flatMap(t => t.photos).sort(() => Math.random() - 0.5).slice(0, 8);   // si alguna no carga, prueba otra
  (function tryNext() {
    const src = pool.shift(); if (!src) return;
    const im = new Image();
    im.onload = () => { bg.style.backgroundImage = 'url("' + src + '")'; };
    im.onerror = tryNext;
    im.src = src;
  })();
})();

/* ---- Inicio: AR ---- */
$("start-ar").addEventListener("click", async () => {
  const scene = document.querySelector("a-scene");
  try {
    if (!scene.hasLoaded) await new Promise(r => scene.addEventListener("loaded", r, { once: true }));
    $("home").style.display = "none";
    $("back-btn").style.display = "block";
    $("legend").style.display = "block";
    document.body.classList.add("ar");
    await scene.systems["mindar-image-system"].start();
    arRunning = true;
  } catch (e) {
    console.error("Error al iniciar AR:", e);
    alert("No se pudo iniciar la cámara AR: " + (e && e.message ? e.message : e));
    $("home").style.display = "flex"; $("back-btn").style.display = "none"; $("legend").style.display = "none";
    document.body.classList.remove("ar");
  }
});

/* Tocar el mapa: abre el punto más cercano al dedo (o un selector si hay varios casi igual de cerca) */
document.addEventListener("click", e => {
  if (!arRunning || stack.length || e.target.closest("button")) return;
  const comp = $("target").components["travel-dots"];
  const c = comp ? comp.pick(e.clientX, e.clientY) : [];
  if (!c.length) return;
  if (c.length === 1 || c[1].d - c[0].d >= AMBIG_PX) return openCard(c[0].t);
  openChooser(c.filter(x => x.d <= c[0].d + 30).slice(0, 6).map(x => x.t));
});

/* ---- Inicio: lista sin cámara ---- */
$("start-list").addEventListener("click", () => {
  $("home").style.display = "none"; $("back-btn").style.display = "block";
  const el = $("list-view"); el.style.display = "block"; el.innerHTML = "";
  ["J", "M", "A", "W"].forEach(w => {
    const items = TRIPS.filter(t => t.who === w);
    el.insertAdjacentHTML("beforeend", "<h3>" + WHO[w].label + " (" + items.length + ")</h3>");
    items.forEach(t => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = '<span class="dot" style="background:' + t.color + '"></span><b>' + (t.lugar || t.pais) +
        '</b><small>' + (t.lugar ? t.pais + " · " : "") + whenText(t) + "</small>";
      r.onclick = () => openCard(t);
      el.appendChild(r);
    });
  });
});
$("back-btn").addEventListener("click", () => location.reload());
</script>
</body>
</html>
